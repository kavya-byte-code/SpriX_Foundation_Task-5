
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice of Our Users</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="testimonials">
        <div class="container">

            <p class="tag">TESTIMONIALS</p>

            <h1>Voice of Our Users</h1>

            <p class="subtitle">
                Real experiences and honest feedback from our
                wonderful community.
            </p>

            <div class="testimonial-card">

                <div class="quote">“</div>

                <div class="stars" id="stars">
                    ★★★★★
                </div>

                <p class="message" id="message">
                    This platform made my learning journey
                    easier and more enjoyable. I really love
                    the simple and clean design!
                </p>

                <div class="profile">
                    <img id="photo"
                         src="https://i.pravatar.cc/100?img=47"
                         alt="Customer profile">

                    <div>
                        <h3 id="name">Ananya Sharma</h3>
                        <p id="role">Student</p>
                    </div>
                </div>

            </div>

            <div class="controls">
                <button id="prev">← Previous</button>
                <div class="dots" id="dots"></div>
                <button id="next">Next →</button>
            </div>

            <p class="footer-text">
                Thank you for being part of our journey!
            </p>

        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
